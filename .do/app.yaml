name: ai-stylist
services:
  - name: web
    github:
      repo: aparatstyledevelopment/ai-stylist
      branch: claude/hello-world-react-V0rdN
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: node server.js
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    envs:
      - key: API_TARGET
        value: https://showroom.aparatstyle.com
        scope: RUN_TIME
